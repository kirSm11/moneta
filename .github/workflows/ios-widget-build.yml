name: Build Moneta iOS + Widget

on:
  workflow_dispatch:
  push:
    branches: ["main", "moneta-ios-widget"]
    paths:
      - "ios/**"
      - ".github/workflows/ios-widget-build.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate Moneta JavaScript
        run: |
          node --check js/utils.js
          node --check js/storage.js
          node --check js/auth.js
          node --check js/stats.js
          node --check js/ui.js
          node --check js/app.js
      - name: Bundle Moneta web app
        run: |
          rm -rf ios/Moneta/web
          mkdir -p ios/Moneta/web
          cp index.html styles.css manifest.webmanifest sw.js ios/Moneta/web/
          cp -R js assets ios/Moneta/web/
          mkdir -p ios/Moneta/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 assets/icon-180.png --out ios/Moneta/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null
          cat > ios/Moneta/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images": [
              {"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          EOF
          cat > ios/Moneta/Assets.xcassets/Contents.json <<'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build unsigned app + widget
        working-directory: ios
        run: |
          xcodebuild -project Moneta.xcodeproj -scheme Moneta -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Moneta.app Payload/
          zip -qry Moneta-Widget-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moneta-Widget-unsigned
          path: ios/Moneta-Widget-unsigned.ipa





