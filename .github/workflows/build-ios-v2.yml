name: Build iOS IPA v2

on:
  workflow_dispatch:
  push:
    branches:
      - ios-native-app
      - main
    paths:
      - "ios/**"
      - "index.html"
      - "styles.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "js/**"
      - "assets/**"
      - ".github/workflows/build-ios-v2.yml"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project ios/Moneta.xcodeproj

      - name: Build for iPhone
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild             -project ios/Moneta.xcodeproj             -scheme Moneta             -configuration Release             -destination 'generic/platform=iOS'             -sdk iphoneos             -derivedDataPath "$PWD/build"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/Moneta.app"
          test -d "$APP_PATH"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/Moneta.app
          /usr/bin/zip -qry Moneta-unsigned.ipa Payload
          ls -lh Moneta-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moneta-iOS-unsigned
          path: Moneta-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
