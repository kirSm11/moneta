name: Moneta
options:
  bundleIdPrefix: com.kirsm11
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  Moneta:
    type: application
    platform: iOS
    sources:
      - path: Moneta
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirsm11.moneta
        INFOPLIST_FILE: Moneta/Info.plist
        CODE_SIGN_ENTITLEMENTS: Moneta/Moneta.entitlements
    dependencies:
      - target: MonetaWidget
  MonetaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MonetaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kirsm11.moneta.widget
        INFOPLIST_FILE: MonetaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: MonetaWidget/MonetaWidget.entitlements
        SKIP_INSTALL: YES
